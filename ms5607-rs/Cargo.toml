[package]
name = "ms5607-rs"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "no_std driver for the MS5607 barometric pressure sensor"
documentation = "https://docs.rs/ms5607-rs"
readme = "README.md"

# Keep the published crate tidy
include = ["src/**", "README.md", "../LICENSE*", "Cargo.toml"]

[dependencies]
ms56xx = { path = "../ms56xx", version = "0.1.0" }
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[features]
default = []
defmt-03 = ["ms56xx/defmt-03"]

[lib]
test = true
doctest = false
bench = false
